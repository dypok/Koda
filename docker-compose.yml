services:
  mongo:
    image: mongo:7
    container_name: koda-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - koda_mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
      - ./content:/content:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: koda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - koda_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: koda-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-koda_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-koda_secret_key_2026}
    volumes:
      - koda_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  koda_mongo_data:
  koda_redis_data:
  koda_minio_data:

