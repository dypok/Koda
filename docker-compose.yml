services:
  mongo:
    image: mongo:7
    container_name: koda-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - koda_mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
      - ./content:/content:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: koda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - koda_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  koda_mongo_data:
  koda_redis_data:

