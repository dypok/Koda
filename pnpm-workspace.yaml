packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  js-yaml: ^4.3.1
  body-parser: ^1.20.6
  lodash: ^4.18.1
  tmp: ^0.2.6
  picomatch: ^4.0.4
  multer: ^2.3.0
  glob: ^10.5.0

allowBuilds:
  '@apollo/protobufjs': false
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true
