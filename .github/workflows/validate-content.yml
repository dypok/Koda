name: Validate Content Contract

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'content/**'
      - 'scripts/validate-content.js'
      - 'scripts/generate-lua-roadmap.js'
      - 'documentation/scripts/**'
      - '.github/workflows/validate-content.yml'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-content:
    name: JSON Schema & Curriculum Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate declarative content (JSON Schema + V-Q06)
        run: node scripts/validate-content.js --check-bmin

      - name: Validate legacy Python curriculum
        run: node documentation/scripts/validate-curriculum.js
