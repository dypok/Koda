    <filter id="glow-alch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-alch)" stroke="#ec4899" stroke-width="4" filter="url(#glow-alch)"/>

