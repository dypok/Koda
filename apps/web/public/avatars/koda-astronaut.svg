<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-astro" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="fur-astro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="visor-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow-astro" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo estelar -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-astro)" stroke="#38bdf8" stroke-width="4" filter="url(#glow-astro)"/>
  <circle cx="45" cy="45" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="160" cy="50" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="140" cy="160" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="50" cy="140" r="1" fill="#ffffff" opacity="0.6"/>

  <!-- Orejas (adaptadas al traje) -->
  <path d="M 44 90 L 30 38 L 80 66 Z" fill="url(#fur-astro)"/>
  <path d="M 156 90 L 170 38 L 120 66 Z" fill="url(#fur-astro)"/>

  <!-- Cabeza de Koda -->
  <ellipse cx="100" cy="110" rx="54" ry="46" fill="url(#fur-astro)"/>

  <!-- Mejillas blancas -->
  <path d="M 48 114 Q 40 132 64 140 Q 86 138 90 118 Z" fill="#fff7ed"/>
  <path d="M 152 114 Q 160 132 136 140 Q 114 138 110 118 Z" fill="#fff7ed"/>

  <!-- Ojos brillantes -->
  <ellipse cx="78" cy="104" rx="9" ry="12" fill="#0f172a"/>
  <circle cx="75" cy="100" r="3.5" fill="#ffffff"/>
  <ellipse cx="122" cy="104" rx="9" ry="12" fill="#0f172a"/>
  <circle cx="119" cy="100" r="3.5" fill="#ffffff"/>

  <!-- Hocico y sonrisa -->
  <ellipse cx="100" cy="122" rx="16" ry="12" fill="#fff7ed"/>
  <path d="M 95 116 Q 100 112 105 116 Q 100 122 95 116 Z" fill="#0f172a"/>
  <path d="M 94 124 Q 100 130 106 124" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Escafandra / Casco espacial (Aro y Visor de Cristal) -->
  <circle cx="100" cy="104" r="64" fill="url(#visor-glass)" stroke="#e2e8f0" stroke-width="5"/>
  <ellipse cx="78" cy="74" rx="22" ry="8" fill="#ffffff" opacity="0.35" transform="rotate(-20 78 74)"/>
  
  <!-- Cuello del traje espacial -->
  <rect x="70" y="166" width="60" height="22" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="85" cy="177" r="4" fill="#38bdf8"/>
  <circle cx="115" cy="177" r="4" fill="#f97316"/>
</svg>
