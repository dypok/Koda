<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-sensei" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="fur-sensei" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow-sensei" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-sensei)" stroke="#f97316" stroke-width="4" filter="url(#glow-sensei)"/>

  <!-- Orejas -->
  <path d="M 44 94 L 28 38 L 82 66 Z" fill="url(#fur-sensei)"/>
  <path d="M 46 84 L 36 46 L 74 66 Z" fill="#fed7aa"/>
  <path d="M 156 94 L 172 38 L 118 66 Z" fill="url(#fur-sensei)"/>
  <path d="M 154 84 L 164 46 L 126 66 Z" fill="#fed7aa"/>

  <!-- Cabeza de Koda -->
  <ellipse cx="100" cy="114" rx="56" ry="48" fill="url(#fur-sensei)"/>

  <!-- Cinta frontal roja/dorada de Maestro -->
  <path d="M 42 86 Q 100 78 158 86 L 158 98 Q 100 90 42 98 Z" fill="#dc2626"/>
  <circle cx="100" cy="89" r="6" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <path d="M 36 94 L 16 112 L 24 126 L 40 102 Z" fill="#b91c1c"/>

  <!-- Mejillas blancas y cejas sabias -->
  <path d="M 46 118 Q 38 136 62 144 Q 86 142 90 122 Z" fill="#fff7ed"/>
  <path d="M 154 118 Q 162 136 138 144 Q 114 142 110 122 Z" fill="#fff7ed"/>

  <!-- Cejas sabias -->
  <path d="M 64 96 Q 78 92 88 98" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 136 96 Q 122 92 112 98" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Ojos serenos de maestro -->
  <path d="M 68 110 Q 78 116 88 110" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 132 110 Q 122 116 112 110" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Hocico y bigotes de maestro -->
  <ellipse cx="100" cy="126" rx="16" ry="12" fill="#fff7ed"/>
  <path d="M 95 120 Q 100 117 105 120 Q 100 125 95 120 Z" fill="#0f172a"/>
  <path d="M 94 128 Q 100 134 106 128" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Barba sabia pequeña de zorro maestro -->
  <path d="M 94 138 Q 100 152 106 138 Z" fill="#fff7ed"/>
</svg>
