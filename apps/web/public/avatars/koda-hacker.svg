<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-hack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="fur-hack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="hood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow-hack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-hack)" stroke="#22c55e" stroke-width="4" filter="url(#glow-hack)"/>

  <!-- Matriz de código tenue al fondo -->
  <text x="32" y="55" fill="#22c55e" opacity="0.3" font-family="monospace" font-size="11">0110</text>
  <text x="142" y="65" fill="#22c55e" opacity="0.3" font-family="monospace" font-size="11">1001</text>
  <text x="28" y="150" fill="#22c55e" opacity="0.25" font-family="monospace" font-size="11">&lt;/&gt;</text>
  <text x="150" y="145" fill="#22c55e" opacity="0.25" font-family="monospace" font-size="11">{;}</text>

  <!-- Capucha exterior -->
  <path d="M 40 100 C 36 30 164 30 160 100 C 160 155 140 180 100 184 C 60 180 40 155 40 100 Z" fill="url(#hood-grad)"/>

  <!-- Silueta de orejas bajo la capucha -->
  <path d="M 52 75 L 34 38 L 76 56 Z" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <path d="M 148 75 L 166 38 L 124 56 Z" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>

  <!-- Rostro de Koda asomando en sombra -->
  <ellipse cx="100" cy="114" rx="46" ry="40" fill="url(#fur-hack)"/>
  <path d="M 56 118 Q 50 134 70 140 Q 88 138 92 122 Z" fill="#fff7ed"/>
  <path d="M 144 118 Q 150 134 130 140 Q 112 138 108 122 Z" fill="#fff7ed"/>

  <!-- Gafas / Terminal Matrix Cyber Glow -->
  <rect x="62" y="96" width="32" height="18" rx="4" fill="#022c22" stroke="#22c55e" stroke-width="2.5"/>
  <text x="68" y="110" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">&gt;_</text>

  <rect x="106" y="96" width="32" height="18" rx="4" fill="#022c22" stroke="#22c55e" stroke-width="2.5"/>
  <text x="112" y="110" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">OK</text>

  <line x1="94" y1="105" x2="106" y2="105" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Hocico y sonrisa confiada -->
  <ellipse cx="100" cy="126" rx="14" ry="11" fill="#fff7ed"/>
  <path d="M 95 122 Q 100 119 105 122 Q 100 126 95 122 Z" fill="#0f172a"/>
  <path d="M 96 128 Q 103 133 107 127" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
</svg>
