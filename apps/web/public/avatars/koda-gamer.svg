<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-gamer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </radialGradient>
    <linearGradient id="fur-gamer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow-gamer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-gamer)" stroke="#ef4444" stroke-width="4" filter="url(#glow-gamer)"/>

  <!-- Orejas -->
  <path d="M 44 94 L 28 38 L 82 66 Z" fill="url(#fur-gamer)"/>
  <path d="M 46 84 L 36 46 L 74 66 Z" fill="#fed7aa"/>
  <path d="M 156 94 L 172 38 L 118 66 Z" fill="url(#fur-gamer)"/>
  <path d="M 154 84 L 164 46 L 126 66 Z" fill="#fed7aa"/>

  <!-- Diadema de Auriculares Gamer Pro -->
  <path d="M 40 106 C 36 34 164 34 160 106" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 40 106 C 36 34 164 34 160 106" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Almohadillas de auriculares -->
  <rect x="28" y="94" width="16" height="34" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
  <rect x="156" y="94" width="16" height="34" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>

  <!-- Micrófono gamer -->
  <path d="M 38 120 Q 50 148 76 142" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="76" cy="142" r="4" fill="#ef4444"/>

  <!-- Cabeza de Koda -->
  <ellipse cx="100" cy="114" rx="54" ry="46" fill="url(#fur-gamer)"/>
  <path d="M 48 118 Q 40 136 64 144 Q 86 142 90 122 Z" fill="#fff7ed"/>
  <path d="M 152 118 Q 160 136 136 144 Q 114 142 110 122 Z" fill="#fff7ed"/>

  <!-- Ojos energéticos -->
  <ellipse cx="78" cy="106" rx="9" ry="13" fill="#0f172a"/>
  <circle cx="75" cy="101" r="3.5" fill="#ffffff"/>
  <circle cx="80" cy="112" r="1.5" fill="#ffffff"/>

  <ellipse cx="122" cy="106" rx="9" ry="13" fill="#0f172a"/>
  <circle cx="119" cy="101" r="3.5" fill="#ffffff"/>
  <circle cx="124" cy="112" r="1.5" fill="#ffffff"/>

  <!-- Hocico y sonrisa victoriosa -->
  <ellipse cx="100" cy="126" rx="16" ry="12" fill="#fff7ed"/>
  <path d="M 95 120 Q 100 117 105 120 Q 100 125 95 120 Z" fill="#0f172a"/>
  <path d="M 94 128 Q 100 137 106 128" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Insignia de Fuego / Racha en el pecho -->
  <path d="M 100 156 Q 106 168 100 178 Q 92 168 96 162 Q 94 164 92 160 Q 96 154 100 156 Z" fill="#f97316"/>
  <path d="M 100 164 Q 103 171 100 176 Q 96 171 98 168 Z" fill="#facc15"/>
</svg>
