    <g id="body-group">
      <path d="M 86.00 75.00 C 84.88 88.72, 84.28 89.04, 84.00 105.00 C 83.72 120.96, 83.32 118.00, 85.00 132.00 C 86.68 146.00, 85.24 143.80, 90.00 155.00 C 94.76 166.20, 93.60 163.88, 102.00 172.00 C 110.40 180.12, 107.12 179.52, 120.00 184.00 C 132.88 188.48, 131.76 188.00, 148.00 188.00 C 164.24 188.00, 164.00 188.48, 178.00 184.00 C 192.00 179.52, 189.04 180.12, 198.00 172.00 C 206.96 163.88, 205.24 166.20, 210.00 155.00 C 214.76 143.80, 214.44 146.00, 215.00 132.00 C 215.56 118.00, 210.04 120.40, 212.00 105.00 C 213.96 89.60, 218.08 90.72, 222.00 77.00 C 225.92 63.28, 225.44 65.24, 226.00 56.00 C 226.56 46.76, 225.40 50.44, 224.00 44.00 C 222.60 37.56, 221.00 33.00, 221.00 33.00 C 221.00 33.00, 213.44 49.44, 207.00 43.00 C 200.56 36.56, 198.00 10.00, 198.00 10.00 C 198.00 10.00, 184.76 26.52, 180.00 24.00 C 175.24 21.48, 181.00 1.00, 181.00 1.00 C 181.00 1.00, 167.96 4.44, 152.00 12.00 C 136.04 19.56, 135.20 28.00, 124.00 28.00 C 112.80 28.00, 112.00 12.00, 112.00 12.00 C 112.00 12.00, 104.72 25.68, 98.00 38.00 C 91.28 50.32, 91.36 45.64, 88.00 56.00 C 84.64 66.36, 87.12 61.28, 86.00 75.00 Z" fill="url(#kodaBody)" stroke="#541108" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
