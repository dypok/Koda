<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 301 226" width="100%" height="100%">
  <defs>
    <!-- 1. Body Flame Gradient -->
    <linearGradient id="kodaBody" x1="0.38" y1="0.02" x2="0.55" y2="0.98">
      <stop offset="0%" stop-color="#FFBD1A"/>
      <stop offset="14%" stop-color="#FFA200"/>
      <stop offset="38%" stop-color="#FF7200"/>
      <stop offset="70%" stop-color="#F04106"/>
      <stop offset="100%" stop-color="#C91E00"/>
    </linearGradient>

    <!-- 2. Core Belly Radiance -->
    <radialGradient id="kodaBelly" cx="0.48" cy="0.56" r="0.42">
      <stop offset="0%" stop-color="#FFA826" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF7505" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E03000" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Forehead Highlights -->
    <linearGradient id="foreheadShine" x1="0.25" y1="0.1" x2="0.65" y2="0.9">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="45%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="crestGold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- 4. Arm Gradients -->
    <linearGradient id="armLeftGrad" x1="0.9" y1="0.2" x2="0.1" y2="0.8">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="55%" stop-color="#EB4407"/>
      <stop offset="100%" stop-color="#C91E00"/>
    </linearGradient>

    <linearGradient id="armRightGrad" x1="0.1" y1="0.2" x2="0.9" y2="0.8">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="55%" stop-color="#EB4407"/>
      <stop offset="100%" stop-color="#C91E00"/>
    </linearGradient>

    <!-- 5. Leg Gradient -->
