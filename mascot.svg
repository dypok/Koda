    <path d="M 140.00 24.00 C 143.00 18.25, 141.75 17.75, 152.00 12.00 C 162.25 6.25, 181.00 1.00, 181.00 1.00 C 181.00 1.00, 182.25 17.25, 180.00 24.00 C 177.75 30.75, 177.00 25.00, 172.00 28.00 C 167.00 31.00, 166.00 32.00, 160.00 36.00 C 154.00 40.00, 153.00 44.25, 148.00 44.00 C 143.00 43.75, 142.00 40.00, 140.00 35.00 C 138.00 30.00, 137.00 29.75, 140.00 24.00 Z" fill="url(#crestGold)" opacity="0.95"/>

